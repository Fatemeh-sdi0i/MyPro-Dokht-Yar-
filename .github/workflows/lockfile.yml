# ساخت package-lock.json برای بک‌اند روی GitHub Actions (که به رجیستری npm دسترسی دارد).
# فقط اجرای دستی؛ package.json تغییر نمی‌کند و فایل قفل‌شده به‌صورت artifact دانلود می‌شود.
name: Generate backend lockfile

on:
  workflow_dispatch:
  push:
    branches: [phase-4-lockfile]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve dependencies without changing package.json
        working-directory: backend
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Show resolved versions
        working-directory: backend
        run: node -e "const l=require('./package-lock.json');for(const k of ['fastify','pg']){console.log(k, l.packages['node_modules/'+k]?.version)}"

      # فقط روی شاخه‌ی همین آزمایش؛ کامیت با GITHUB_TOKEN دوباره گردش‌کار را فعال نمی‌کند
      - name: Commit lockfile to this branch
        if: github.ref == 'refs/heads/phase-4-lockfile'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(backend): ساخت package-lock.json (بدون تغییر package.json)"
            git push origin HEAD:phase-4-lockfile
          fi
