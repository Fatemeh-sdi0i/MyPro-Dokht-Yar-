# آزمون بک‌اند روی PostgreSQL واقعی (سرویس رایگان GitHub Actions)
name: Backend CI

on:
  push:
    branches: [phase-4-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  db-schema:
    name: Database schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run schema tests
        run: ./backend/db/test/schema_test.sh
