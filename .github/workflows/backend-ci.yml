# آزمون بک‌اند روی PostgreSQL واقعی (سرویس رایگان GitHub Actions)
name: Backend CI

on:
  push:
    branches: [phase-4-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  db-schema:
    name: Database schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run schema tests
        run: ./backend/db/test/schema_test.sh

  api:
    name: API tests (Fastify + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dokhtyar_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Create test database and apply migrations
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -qc "CREATE DATABASE dokhtyar_test"
          ./backend/db/migrate.sh

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run API tests
        working-directory: backend
        run: npm test

  frontend-logic:
    name: Frontend logic tests (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test tests/jalali.test.js
